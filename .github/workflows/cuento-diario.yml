- name: Generar Cuento
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          python scripts/generar_cuento.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de Astro
        run: npm ci || npm install

      - name: Compilar sitio web con Astro
        run: npm run build

      - name: Guardar nuevo cuento en Git
        run: |
          git config --global user.name 'Bot Cuentero'
          git config --global user.email 'bot@cuentacuentos.local'
          git add src/content/cuentos/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat: cuento diario [skip ci]" && git push)

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
