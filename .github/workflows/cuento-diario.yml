name: Generar Cuento Diario

on:
  schedule:
    - cron: '0 12 * * *' # Ajusta aquí el horario de ejecución si aplica
  workflow_dispatch:

jobs:
  # TAREA 1: Genera el cuento, hace commit y sube el código para que Astro lo compile
  generar-y-desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests google-generativeai pillow

      - name: Generar cuento e imágenes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Corre el script en modo solo generación (sin enviar avisos todavía)
          python generar_cuento.py --solo-generar

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: cuento diario publicado" || exit 0
          git push origin main

  # TAREA 2: Se ejecuta SOLO cuando la Tarea 1 termine y el sitio web esté publicado
  notificar-redes:
    needs: generar-y-desplegar # <-- Espera obligatoria
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Esperar 90 segundos para asegurar despliegue de GitHub Pages
        run: sleep 90

      - name: Publicar en Facebook y Telegram
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Corre el paso para notificar a ambas redes
          python generar_cuento.py --solo-notificar
