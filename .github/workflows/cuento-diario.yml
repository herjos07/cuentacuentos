
name: Publicar Cuento Diario

on:
  schedule:
    # Se ejecuta todos los días a las 13:48 UTC (7:48 AM hora CDMX)
    - cron: '43 1,13 * * *'
  workflow_dispatch:

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio cuentacuentos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-slugify requests

      - name: Generar Cuento Diario
        id: generar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: "https://herjos.com/cuentacuentos"
        run: python scripts/generar_cuento.py

      # --- NUEVO PASO: Guardar el archivo .md en el repo de cuentacuentos ---
      - name: Commit y Push del cuento diario en cuentacuentos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/cuentos/
          if git diff --staged --quiet; then
            echo "No hay nuevos cuentos que guardar en el repo."
          else
            git commit -m "chore: agregar cuento generado automáticamente [skip ci]"
            git push origin main
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de Astro
        run: npm install

      - name: Compilar sitio con Astro
        run: npm run build

      # --- DESPLIEGUE EN EL REPOSITORIO PRINCIPAL (HerJos) ---
      - name: Checkout del repositorio principal (HerJos)
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository_owner }}/HerJos'
          token: ${{ secrets.GH_PAT }}
          path: repo-principal

      - name: Copiar archivos compilados a la carpeta /cuentacuentos
        run: |
          mkdir -p repo-principal/cuentacuentos
          rm -rf repo-principal/cuentacuentos/*
          cp -r dist/* repo-principal/cuentacuentos/

      - name: Commit y Push al repositorio principal
        run: |
          cd repo-principal
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cuentacuentos/
          if git diff --staged --quiet; then
            echo "No hay cambios para subir."
          else
            git commit -m "update: nuevo cuento publicado en /cuentacuentos [skip ci]"
            git push origin main
          fi

      # --- PUBLICAR EN REDES: se hace AL FINAL, después del deploy ---
      # El script verifica que la URL responda 200 antes de publicar,
      # así se evita el 404 en la previsualización de Facebook/Telegram.
      - name: Publicar en Telegram y Facebook
        env:
          TITULO: ${{ steps.generar.outputs.titulo }}
          RESUMEN: ${{ steps.generar.outputs.resumen }}
          URL_CUENTO: ${{ steps.generar.outputs.url_cuento }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python scripts/publicar_redes.py
