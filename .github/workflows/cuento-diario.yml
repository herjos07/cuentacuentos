name: Publicar Cuento Diario

on:
  schedule:
    # Se ejecuta todos los días a las 15:37 UTC (9:37 AM hora CDMX)
    - cron: '37 15 * * *'
  workflow_dispatch:

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio cuentacuentos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-slugify requests

      # --- 1. Generar únicamente el cuento (.md) sin notificar aún ---
      - name: Generar Cuento Diario
        id: generar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generar_cuento.py --solo-generar
          
          # Capturamos la ruta del cuento recién generado
          ULTIMO_CUENTO=$(ls -t src/content/cuentos/*.md | head -n 1)
          echo "CUENTO_PATH=$ULTIMO_CUENTO" >> $GITHUB_ENV

      # --- 2. Guardar el archivo .md en el repo cuentacuentos ---
      - name: Commit y Push del cuento diario en cuentacuentos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/cuentos/
          if git diff --staged --quiet; then
            echo "No hay nuevos cuentos que guardar en el repo."
          else
            git commit -m "chore: agregar cuento generado automáticamente [skip ci]"
            git push origin main
          fi

      # --- 3. Compilar el sitio con Astro ---
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de Astro
        run: npm install

      - name: Compilar sitio con Astro
        run: npm run build

      # --- 4. Desplegar en el repositorio principal (HerJos) ---
      - name: Checkout del repositorio principal (HerJos)
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository_owner }}/HerJos'
          token: ${{ secrets.GH_PAT }}
          path: repo-principal

      - name: Copiar archivos compilados a la carpeta /cuentacuentos
        run: |
          mkdir -p repo-principal/cuentacuentos
          rm -rf repo-principal/cuentacuentos/*
          cp -r dist/* repo-principal/cuentacuentos/

      - name: Commit y Push al repositorio principal
        run: |
          cd repo-principal
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cuentacuentos/
          if git diff --staged --quiet; then
            echo "No hay cambios para subir."
          else
            git commit -m "update: nuevo cuento publicado en /cuentacuentos [skip ci]"
            git push origin main
          fi

      # --- 5. Esperar 5 minutos para propagación del servidor Web ---
      - name: Esperar 5 minutos a la publicación web
        run: sleep 300

      # --- 6. Ejecutar script de publicación en redes sociales ---
      - name: Publicar en Redes Sociales (Facebook y Telegram)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          SITE_BASE_URL: "https://herjos.com/cuentacuentos"
        run: |
          python scripts/publicar_redes.py --archivo "$CUENTO_PATH"
