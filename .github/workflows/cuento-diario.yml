name: Publicar Cuento Diario

on:
  schedule:
    # Se ejecuta todos los días a las 13:00 UTC (7:00 AM hora del Centro de México)
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de generación
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: 'https://tusitio.com/cuentos'
        run: python scripts/generar_cuento.py

      - name: Guardar el nuevo cuento en Git
        run: |
          git config --global user.name 'Bot Cuentero'
          git config --global user.email 'bot@tusitio.com'
          git add content/cuentos/*.md
          git commit -m "feat: cuento diario automático [skip ci]" || exit 0
          git push
