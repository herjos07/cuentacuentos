name: Publicar Cuento Diario

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 AM UTC (12:00 AM hora México)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Otorga permisos explícitos de escritura para hacer commit

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-slugify requests

      - name: Generar Cuento
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          python scripts/generar_cuento.py

      - name: Hacer commit y push del nuevo cuento
        run: |
          git config --global user.name 'Bot Cuentero'
          git config --global user.email 'bot@cuentacuentos.local'
          git add content/cuentos/
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat: cuento diario automático [skip ci]" && git push)
