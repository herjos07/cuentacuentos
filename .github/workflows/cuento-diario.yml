name: Publicar Cuento Diario

on:
  schedule:
    # Se ejecuta todos los días a las 15:30 UTC (9:30 AM hora CDMX)
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio cuentacuentos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-slugify requests

      - name: Generar Cuento con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          python scripts/generar_cuento.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de Astro
        run: npm ci

      - name: Compilar sitio con Astro
        run: npm run build

      # --- DESPLIEGUE EN EL REPOSITO MAIN (HerJos) ---
      - name: Checkout del repositorio principal (HerJos)
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository_owner }}/HerJos'
          token: ${{ secrets.GH_PAT }}
          path: repo-principal

      - name: Copiar archivos compilados a la carpeta /cuentacuentos
        run: |
          mkdir -p repo-principal/cuentacuentos
          rm -rf repo-principal/cuentacuentos/*
          cp -r dist/* repo-principal/cuentacuentos/

      - name: Commit y Push al repositorio principal
        run: |
          cd repo-principal
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cuentacuentos/
          if git diff --staged --quiet; then
            echo "No hay cambios para subir."
          else
            git commit -m "update: nuevo cuento publicado en /cuentacuentos [skip ci]"
            git push origin main
          fi
