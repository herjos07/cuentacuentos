name: Generar Cuento, Publicar y Notificar

on:
  schedule:
    - cron: '31 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generar-y-desplegar:
    runs-on: ubuntu-latest
    # Definimos la salida para transmitir la ruta del cuento generado
    outputs:
      cuento_path: ${{ steps.generar.outputs.cuento_path }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          pip install requests google-genai python-slugify

      - name: Generar nuevo cuento .md
        id: generar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Ejecutamos la generación y guardamos la ruta del archivo recién creado
          PYTHON_OUTPUT=$(python scripts/generar_cuento.py --solo-generar)
          echo "$PYTHON_OUTPUT"
          
          # Buscamos el último archivo .md creado en src/content/cuentos/
          ULTIMO_CUENTO=$(ls -t src/content/cuentos/*.md | head -n 1)
          echo "cuento_path=$ULTIMO_CUENTO" >> $GITHUB_OUTPUT

      - name: Guardar el nuevo cuento en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: nuevo cuento generado [skip ci]" || exit 0
          git push origin main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y Compilar Sitio Web (Astro)
        run: |
          npm install
          npm run build

      - name: Subir artefactos a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Desplegar sitio web en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notificar-redes:
    needs: generar-y-desplegar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          pip install requests python-slugify google-genai

      - name: Publicar en Facebook y Telegram
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUENTO_PATH: ${{ needs.generar-y-desplegar.outputs.cuento_path }}
        run: |
          python scripts/generar_cuento.py --solo-notificar --archivo "$CUENTO_PATH"
