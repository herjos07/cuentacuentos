name: Generar Cuento y Publicar Sitio

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generar-y-desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          pip install requests google-genai python-slugify

      - name: Generar nuevo cuento .md
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generar_cuento.py --solo-generar

      - name: Guardar el nuevo cuento en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: nuevo cuento generado [skip ci]" || exit 0
          git push origin main

      - name: Configurar Node.js para Astro
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Astro y Compilar Sitio Web
        run: |
          npm ci
          npm run build

      - name: Subir artefactos de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Desplegar sitio web en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notificar-redes:
    needs: generar-y-desplegar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio (último commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests python-slugify google-genai

      - name: Publicar en Facebook y Telegram
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/generar_cuento.py --solo-notificar
